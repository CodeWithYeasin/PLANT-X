; PlatformIO project configuration for PLANT-X
; Board: STM32F103C8T6 "Blue Pill", flashed over SWD with an ST-LINK V2

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
debug_tool = stlink

lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    chris--a/Keypad
